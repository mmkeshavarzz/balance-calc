<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <!--
    ╔══════════════════════════════════════════════════════════════╗
    ║  محاسبه‌گر تراز کنکور — نسخه 1.2.3                         ║
    ║  Engine: v6.2 (Calibrated Model)                            ║
    ║  Last Update: 1404/12/07                                    ║
    ║                                                              ║
    ║  Design System:                                              ║
    ║    • Bento Grid Layout (30%)                                 ║
    ║    • Glassmorphism (40%)                                     ║
    ║    • Neumorphism (30%)                                       ║
    ║    • Pastel Color Palette on Pearl White Base                ║
    ╚══════════════════════════════════════════════════════════════╝
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="محاسبه‌گر هوشمند تراز کنکور تجربی — مدل کالیبره شده v6.2">
    <title>محاسبه‌گر تراز کنکور | v1.2.3</title>

    <!-- ─── Google Fonts: Vazirmatn ─── -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- ─── Stylesheet ─── -->
    <link rel="stylesheet" href="style.css">

    <!-- ─── html2canvas for PNG Export ─── -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
</head>
<body>

    <!-- ════════════════════════════════════════════════════════════
         App Container — Bento Grid Layout
         ════════════════════════════════════════════════════════════ -->
    <main class="app-container" id="appContainer">

        <!-- ─── Header Card ─── -->
        <header class="header-card animate-in">
            <h1>📊 محاسبه‌گر تراز کنکور</h1>
            <p class="subtitle">مدل کالیبره شده — رشته تجربی</p>
            <span class="version-badge">v1.2.3 — Engine 6.2</span>
        </header>

        <!-- ─── Field Selector (انتخاب رشته) ─── -->
        <section class="field-selector animate-in" style="animation-delay: 0.1s;">
            <label class="field-selector__label">🎯 رشته خودت رو انتخاب کن:</label>
            <div class="field-selector__grid">
                <button class="field-btn" data-field="tajrobi" onclick="selectField('tajrobi')">
                    <span class="field-btn__icon">🧬</span>
                    تجربی
                </button>
                <button class="field-btn" data-field="riazi" onclick="selectField('riazi')">
                    <span class="field-btn__icon">📐</span>
                    ریاضی
                </button>
                <button class="field-btn" data-field="ensani" onclick="selectField('ensani')">
                    <span class="field-btn__icon">📚</span>
                    انسانی
                </button>
                <button class="field-btn" data-field="honar" onclick="selectField('honar')">
                    <span class="field-btn__icon">🎨</span>
                    هنر
                </button>
            </div>
        </section>

        <!-- ─── Subjects Input Grid (کارت‌ها داینامیک ساخته میشن) ─── -->
        <section class="subjects-grid" id="subjectsGrid" style="display: none;"></section>

        <!-- ─── Results Card ─── -->
        <section class="results-card" id="resultsCard" style="display: none;">
            <p class="results-card__label">تراز تخمینی شما</p>
            <div class="results-card__value" id="trazValue">—</div>
            <p class="results-card__error-margin" id="errorMargin">خطای مدل: ±۱۹.۵</p>

            <div class="results-card__score-bar">
                <div class="results-card__score-fill" id="scoreFill"></div>
            </div>

            <div class="results-card__breakdown" id="breakdownGrid">
                <!-- آیتم‌های تفکیک وزنی هر درس اینجا رندر میشن -->
            </div>
        </section>

        <!-- ─── Actions Row ───
             *** فیکس v1.2.3: کلاس CSS به جای inline style ***
             مشکل نمایش دکمه‌ها در مرورگر دسکتاپ حل شد.
        -->
        <section class="actions-row actions-row--hidden" id="actionsSection">
            <button class="action-btn action-btn--primary" onclick="exportPNG()">
                <span class="action-btn__icon">📸</span>
                خروجی PNG
            </button>
            <button class="action-btn" onclick="saveToLocal()">
                <span class="action-btn__icon">💾</span>
                ذخیره
            </button>
            <button class="action-btn action-btn--danger" onclick="resetAll()">
                <span class="action-btn__icon">🗑️</span>
                پاک کردن
            </button>
        </section>

        <!-- ─── Footer ─── -->
        <footer class="footer-note">
            مدل v6.2 — کالیبره شده با داده‌های واقعی<br>
            خطای مدل: ±۱۹.۵ (کاهش ۵۲٪ نسبت به نسخه قبل)<br>
            📅 آخرین بروزرسانی: ۱۴۰۴/۱۲/۰۷
        </footer>
    </main>

    <!-- ─── Toast Notification ─── -->
    <div class="toast" id="toast"></div>

    <!-- ─── Application Logic ─── -->
    <script src="app.js"></script>
</body>
</html>
