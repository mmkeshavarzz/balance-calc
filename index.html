<style>
/* ============================================================
   CSS Variables
   ============================================================ */
:root {
    --pearl: #F8F6F2;
    --pearl-dk: #EDE9E3;
    --pearl-lt: #FDFCFA;
    --txt: #2D2B28;
    --txt2: #6B6560;
    --txt3: #9E9892;

    --p-rose: #FFB5B5;
    --p-peach: #FFDAB9;
    --p-mint: #B5EAD7;
    --p-sky: #B5D8FF;
    --p-sky-s: #D4E8FF;
    --p-lav: #D4B5FF;
    --p-lav-s: #E8D4FF;
    --p-lemon: #FFF3B5;
    --p-coral: #FFB5C5;
    --p-rose-s: #FFD4D4;
    --p-coral-s: #FFD4DE;

    --c-zist: #66BB6A;
    --c-shimi: #42A5F5;
    --c-fizik: #FFA726;
    --c-riazi: #AB47BC;
    --c-zamin: #8D6E63;

    --glass-bg: rgba(255,255,255,0.55);
    --glass-brd: rgba(255,255,255,0.35);
    --glass-blur: 16px;

    --neu-lt: #FFFFFF;
    --neu-dk: #D1CDC7;
    --neu-out: 6px 6px 14px var(--neu-dk), -6px -6px 14px var(--neu-lt);
    --neu-in: inset 4px 4px 10px var(--neu-dk), inset -4px -4px 10px var(--neu-lt);

    --r-sm: 12px;
    --r-md: 18px;
    --r-lg: 24px;
    --r-xl: 32px;
    --sp-xs: 4px;
    --sp-sm: 8px;
    --sp-md: 16px;
    --sp-lg: 24px;
    --sp-xl: 32px;

    --font: 'Vazirmatn', system-ui, -apple-system, sans-serif;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
}

/* ============================================================
   Reset & Base
   ============================================================ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { font-size:16px; scroll-behavior:smooth; }
body {
    font-family: var(--font);
    background: var(--pearl);
    color: var(--txt);
    min-height: 100vh;
    line-height: 1.7;
    overflow-x: hidden;
    background-image: radial-gradient(circle at 1px 1px, rgba(0,0,0,0.03) 1px, transparent 0);
    background-size: 28px 28px;
}

/* ============================================================
   App Container — Bento Grid
   ============================================================ */
.app-container {
    max-width: 520px;
    margin: 0 auto;
    padding: var(--sp-lg) var(--sp-md);
    display: flex;
    flex-direction: column;
    gap: var(--sp-lg);
}

/* ============================================================
   Header Card — Glassmorphism
   ============================================================ */
.header-card {
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid var(--glass-brd);
    border-radius: var(--r-lg);
    padding: var(--sp-xl) var(--sp-lg);
    text-align: center;
    position: relative;
    overflow: hidden;
    animation: fadeUp .5s var(--ease) forwards;
}
.header-card::before {
    content:'';
    position:absolute;
    top:-50%; right:-50%;
    width:200%; height:200%;
    background: radial-gradient(ellipse at 30% 20%, rgba(180,220,255,0.15) 0%, transparent 60%);
    pointer-events:none;
}
.header-card h1 {
    font-size:1.45rem; font-weight:800; position:relative;
}
.header-card .subtitle {
    font-size:.82rem; font-weight:400; color:var(--txt3); position:relative;
}
.version-badge {
    display:inline-block;
    background: linear-gradient(135deg, var(--p-sky), var(--p-lav));
    color: var(--txt);
    font-size:.68rem; font-weight:600;
    padding:2px 10px; border-radius:20px;
    margin-top: var(--sp-sm); position:relative;
}

/* ============================================================
   Field Selector — Neumorphism
   ============================================================ */
.field-selector {
    background: var(--pearl);
    border-radius: var(--r-lg);
    box-shadow: var(--neu-out);
    padding: var(--sp-lg);
    animation: fadeUp .5s .1s var(--ease) both;
}
.field-selector__label {
    display:block;
    font-size:.85rem; font-weight:600; color:var(--txt2);
    margin-bottom:var(--sp-md); text-align:center;
}
.field-selector__grid {
    display:grid;
    grid-template-columns: repeat(2,1fr);
    gap: var(--sp-sm);
}
.field-btn {
    background: var(--glass-bg);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 2px solid transparent;
    border-radius: var(--r-md);
    padding: var(--sp-md) var(--sp-sm);
    font-family: var(--font);
    font-size:.88rem; font-weight:600;
    color: var(--txt2);
    cursor:pointer;
    transition: all .3s var(--ease);
    text-align:center;
}
.field-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0,0,0,.08);
}
.field-btn:active { transform: translateY(0); }
.field-btn.active {
    border-color: var(--p-sky);
    background: linear-gradient(135deg, var(--p-sky-s), var(--p-lav-s));
    color: var(--txt);
    box-shadow: 0 4px 18px rgba(181,216,255,.4);
}
.field-btn__icon { display:block; font-size:1.6rem; margin-bottom:var(--sp-xs); }

/* ============================================================
   Subject Cards Grid
   ============================================================ */
.subjects-grid {
    display:grid;
    grid-template-columns: repeat(2,1fr);
    gap: var(--sp-md);
}
.subject-card {
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid var(--glass-brd);
    border-radius: var(--r-md);
    padding: var(--sp-lg) var(--sp-md);
    position:relative; overflow:hidden;
    transition: all .3s var(--ease);
    animation: fadeUp .4s var(--ease) both;
}
.subject-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,0,0,.06);
}
.subject-card--wide { grid-column: span 2; }

/* نوار رنگی بالای کارت */
.subject-card::before {
    content:''; position:absolute;
    top:0; right:0; left:0; height:4px;
    border-radius: var(--r-md) var(--r-md) 0 0;
    background: var(--c-zist);
}
.subject-card[data-subject="shimi"]::before,
.subject-card[data-subject="arabi"]::before,
.subject-card[data-subject="shimi_r"]::before,
.subject-card[data-subject="khalaghiat"]::before { background: var(--c-shimi); }
.subject-card[data-subject="fizik"]::before,
.subject-card[data-subject="tarikh"]::before,
.subject-card[data-subject="fizik_r"]::before,
.subject-card[data-subject="savad_basari"]::before { background: var(--c-fizik); }
.subject-card[data-subject="riazi"]::before,
.subject-card[data-subject="falsafe"]::before,
.subject-card[data-subject="riazi_r"]::before,
.subject-card[data-subject="darsname"]::before { background: var(--c-riazi); }
.subject-card[data-subject="zamin"]::before,
.subject-card[data-subject="ravanshenasi"]::before,
.subject-card[data-subject="hndse"]::before { background: var(--c-zamin); }

.subject-card__header {
    display:flex; align-items:center;
    justify-content:space-between;
    margin-bottom: var(--sp-md);
}
.subject-card__title {
    font-size:.9rem; font-weight:700;
    display:flex; align-items:center; gap:var(--sp-sm);
    flex-wrap: wrap;
}
.subject-card__title-icon { font-size:1.2rem; }
.subject-card__weight {
    font-size:.68rem; font-weight:500; color:var(--txt3);
    background:var(--pearl-dk); padding:2px 8px; border-radius:10px;
}

/* Toggle Switch */
.toggle-switch {
    position:relative; width:44px; height:24px; flex-shrink:0;
}
.toggle-switch input { opacity:0; width:0; height:0; }
.toggle-switch__slider {
    position:absolute; cursor:pointer;
    top:0; left:0; right:0; bottom:0;
    background:var(--pearl-dk); border-radius:24px;
    transition:.2s; box-shadow: var(--neu-in);
}
.toggle-switch__slider::before {
    content:''; position:absolute;
    height:18px; width:18px; left:3px; bottom:3px;
    background:#fff; border-radius:50%;
    transition:.2s; box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.toggle-switch input:checked + .toggle-switch__slider {
    background: linear-gradient(135deg, var(--p-mint), var(--p-sky));
}
.toggle-switch input:checked + .toggle-switch__slider::before {
    transform: translateX(20px);
}

/* Percent Input */
.subject-card__input-group { position:relative; }
.subject-card__input {
    width:100%;
    background:var(--pearl);
    border:2px solid var(--pearl-dk);
    border-radius:var(--r-sm);
    padding: var(--sp-md);
    padding-left: 44px;
    font-family: var(--font);
    font-size:1.3rem; font-weight:700;
    color:var(--txt); text-align:center;
    transition: all .2s;
    box-shadow: var(--neu-in);
    -moz-appearance: textfield;
}
.subject-card__input::-webkit-outer-spin-button,
.subject-card__input::-webkit-inner-spin-button {
    -webkit-appearance:none; margin:0;
}
.subject-card__input:focus {
    outline:none;
    border-color:var(--p-sky);
    box-shadow: var(--neu-in), 0 0 0 3px rgba(181,216,255,.3);
}
.subject-card__input:disabled { opacity:.4; cursor:not-allowed; }
.subject-card__input-suffix {
    position:absolute; left:var(--sp-md);
    top:50%; transform:translateY(-50%);
    font-size:.9rem; font-weight:600;
    color:var(--txt3); pointer-events:none;
}

/* Range Slider */
.subject-card__slider {
    width:100%; margin-top:var(--sp-sm);
    -webkit-appearance:none; appearance:none;
    height:6px; border-radius:3px;
    background:var(--pearl-dk); outline:none;
}
.subject-card__slider::-webkit-slider-thumb {
    -webkit-appearance:none; appearance:none;
    width:22px; height:22px; border-radius:50%;
    background:#fff; cursor:pointer;
    border:3px solid var(--p-sky);
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    transition:.2s;
}
.subject-card__slider::-moz-range-thumb {
    width:22px; height:22px; border-radius:50%;
    background:#fff; cursor:pointer;
    border:3px solid var(--p-sky);
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.subject-card__slider:disabled { opacity:.3; cursor:not-allowed; }

/* Disabled card state */
.subject-card--disabled {
    opacity:.5; filter:grayscale(40%);
}
.subject-card--disabled .subject-card__input-group,
.subject-card--disabled .subject-card__slider {
    pointer-events:none;
}

/* ============================================================
   Results Card — Neumorphism
   ============================================================ */
.results-card {
    background:var(--pearl);
    border-radius:var(--r-xl);
    box-shadow:var(--neu-out);
    padding:var(--sp-xl) var(--sp-lg);
    text-align:center; position:relative; overflow:hidden;
}
.results-card::before {
    content:''; position:absolute;
    top:0; right:0; left:0; height:5px;
    background: linear-gradient(90deg, var(--p-rose), var(--p-peach), var(--p-lemon), var(--p-mint), var(--p-sky), var(--p-lav));
}
.results-card__label {
    font-size:.85rem; font-weight:500; color:var(--txt3);
    margin-bottom:var(--sp-sm);
}
.results-card__value {
    font-size:3rem; font-weight:900;
    background: linear-gradient(135deg, #4A90D9, #7B68EE);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    line-height:1.2; margin-bottom:var(--sp-xs);
}
.results-card__error {
    font-size:.76rem; font-weight:500; color:var(--txt3);
    margin-bottom:var(--sp-md);
}
.results-card__bar {
    background:var(--pearl-dk); border-radius:8px;
    height:10px; overflow:hidden;
    margin-bottom:var(--sp-md);
    box-shadow: var(--neu-in);
}
.results-card__fill {
    height:100%; border-radius:8px; width:0%;
    background: linear-gradient(90deg, var(--p-mint), var(--p-sky), var(--p-lav));
    transition: width .5s var(--ease);
}
.results-card__breakdown {
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(75px, 1fr));
    gap:var(--sp-sm); margin-top:var(--sp-md);
}
.bd-item {
    background:var(--glass-bg);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border:1px solid var(--glass-brd);
    border-radius:var(--r-sm);
    padding:var(--sp-sm); text-align:center;
}
.bd-item__label {
    font-size:.66rem; font-weight:500; color:var(--txt3); margin-bottom:2px;
}
.bd-item__value {
    font-size:.92rem; font-weight:700; color:var(--txt);
}

/* ============================================================
   Actions Row
   ============================================================ */
.actions-row {
    display:flex; gap:var(--sp-sm);
    flex-wrap:wrap; justify-content:center;
    opacity:1; transform:translateY(0);
    pointer-events:auto;
    transition: opacity .5s var(--ease), transform .5s var(--ease);
}
.actions-row.hidden {
    opacity:0; transform:translateY(20px);
    pointer-events:none;
}
.action-btn {
    flex:1; min-width:110px; max-width:200px;
    background:var(--pearl);
    box-shadow:var(--neu-out);
    border:none; border-radius:var(--r-md);
    padding:var(--sp-md) var(--sp-lg);
    font-family:var(--font);
    font-size:.82rem; font-weight:600;
    color:var(--txt2); cursor:pointer;
    transition:all .2s var(--ease);
    display:flex; align-items:center;
    justify-content:center; gap:var(--sp-sm);
}
.action-btn:hover {
    box-shadow:4px 4px 10px var(--neu-dk), -4px -4px 10px var(--neu-lt);
    transform:translateY(-1px);
}
.action-btn:active {
    box-shadow:var(--neu-in); transform:translateY(0);
}
.action-btn--primary {
    background: linear-gradient(135deg, var(--p-sky-s), var(--p-lav-s));
    color:var(--txt);
}
.action-btn--danger {
    background: linear-gradient(135deg, var(--p-rose-s), var(--p-coral-s));
    color:#C0392B;
}
.action-btn__icon { font-size:1.1rem; }

/* ============================================================
   Footer
   ============================================================ */
.footer-note {
    text-align:center; font-size:.72rem;
    color:var(--txt3); padding:var(--sp-md); line-height:1.8;
}

/* ============================================================
   Toast
   ============================================================ */
.toast {
    position:fixed; bottom:30px; left:50%;
    transform:translateX(-50%) translateY(100px);
    background:var(--txt); color:#fff;
    font-family:var(--font); font-size:.82rem; font-weight:500;
    padding:var(--sp-md) var(--sp-xl);
    border-radius:var(--r-md); z-index:9999;
    opacity:0; transition:all .35s var(--ease);
    pointer-events:none;
    box-shadow:0 8px 30px rgba(0,0,0,.2);
    text-align:center; max-width:90vw;
}
.toast.show {
    opacity:1; transform:translateX(-50%) translateY(0);
}

/* ============================================================
   Animations
   ============================================================ */
@keyframes fadeUp {
    from { opacity:0; transform:translateY(20px); }
    to   { opacity:1; transform:translateY(0); }
}
@keyframes pulseGlow {
    0%,100% { box-shadow:0 0 0 0 rgba(181,216,255,.4); }
    50%     { box-shadow:0 0 0 12px rgba(181,216,255,0); }
}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width:400px) {
    .app-container { padding:var(--sp-md) var(--sp-sm); }
    .subjects-grid { grid-template-columns:1fr; }
    .subject-card--wide { grid-column:span 1; }
    .results-card__value { font-size:2.4rem; }
    .field-btn { padding:var(--sp-sm); font-size:.78rem; }
}
@media (min-width:768px) {
    .app-container { max-width:580px; }
    .results-card__value { font-size:3.6rem; }
}

/* Export mode */
.exporting .actions-row { display:none !important; }
@media print {
    body { background:#fff; background-image:none; }
    .actions-row, .field-selector { display:none !important; }
}
</style>
</head>

            label: 'هنر', icon: '🎨', tw: 28,
            subs: [
                { id:'darsname',     name:'درسنامه هنر',   icon:'🎭', w:10, wide:true },
                { id:'khalaghiat',   name:'خلاقیت تصویری', icon:'🖌️', w:8  },
                { id:'savad_basari', name:'سواد بصری',     icon:'👁️', w:6  },
                { id:'tarhsazi',     name:'طراحی',         icon:'✏️', w:4  }
            ]
        }
    };

    /* ─── State ─── */
    var curField = null;
    var state = {};
    var debounceTimer = null;

    /* ─── DOM Refs ─── */
    var fieldGridEl   = document.getElementById('fieldGrid');
    var subsGridEl    = document.getElementById('subjectsGrid');
    var resultsEl     = document.getElementById('resultsCard');
    var actionsEl     = document.getElementById('actionsRow');
    var trazEl        = document.getElementById('trazValue');
    var errorEl       = document.getElementById('errorInfo');
    var fillEl        = document.getElementById('scoreFill');
    var breakdownEl   = document.getElementById('breakdownGrid');
    var toastEl       = document.getElementById('toast');

    /* ─── Build Field Buttons ─── */
    function buildFieldButtons() {
        var html = '';
        for (var key in FIELDS) {
            if (!FIELDS.hasOwnProperty(key)) continue;
            var f = FIELDS[key];
            html += '<button class="field-btn" data-field="' + key + '">'
                  + '<span class="field-btn__icon">' + f.icon + '</span>'
                  + f.label
                  + '</button>';
        }
        fieldGridEl.innerHTML = html;

        /* رویداد کلیک */
        var btns = fieldGridEl.querySelectorAll('.field-btn');
        for (var i = 0; i < btns.length; i++) {
            btns[i].addEventListener('click', function() {
                selectField(this.getAttribute('data-field'));
            });
        }
    }

    /* ─── Select Field ─── */
    function selectField(key) {
        if (!FIELDS[key]) return;
        curField = key;
        var cfg = FIELDS[key];

        /* آپدیت دکمه‌ها */
        var btns = fieldGridEl.querySelectorAll('.field-btn');
        for (var i = 0; i < btns.length; i++) {
            if (btns[i].getAttribute('data-field') === key) {
                btns[i].classList.add('active');
            } else {
                btns[i].classList.remove('active');
            }
        }

        /* ساخت state */
        state = {};
        for (var j = 0; j < cfg.subs.length; j++) {
            var s = cfg.subs[j];
            state[s.id] = { pct: 0, on: true };
        }

        /* بارگذاری از localStorage */
        loadLocal();

        /* رندر کارت‌ها */
        renderCards(cfg);

        /* نمایش بخش‌ها */
        subsGridEl.style.display = 'grid';
        resultsEl.style.display  = 'block';
        actionsEl.classList.remove('hidden');

        /* محاسبه اولیه */
        recalc();
    }

    /* ─── Render Subject Cards ─── */
    function renderCards(cfg) {
        var html = '';
        for (var i = 0; i < cfg.subs.length; i++) {
            var s   = cfg.subs[i];
            var st  = state[s.id];
            var wpct = ((s.w / cfg.tw) * 100).toFixed(1);
            var cls = 'subject-card';
            if (s.wide) cls += ' subject-card--wide';
            if (!st.on) cls += ' subject-card--disabled';

            html += '<div class="' + cls + '" data-subject="' + s.id + '" '
                  + 'style="animation-delay:' + (0.05 * (i + 1)) + 's">'

                  + '<div class="subject-card__header">'
                  + '  <div class="subject-card__title">'
                  + '    <span class="subject-card__title-icon">' + s.icon + '</span>'
                  + '    ' + s.name
                  + '    <span class="subject-card__weight">' + wpct + '%</span>'
                  + '  </div>'
                  + '  <label class="toggle-switch">'
                  + '    <input type="checkbox" data-sid="' + s.id + '" '
                  + (st.on ? 'checked' : '') + '>'
                  + '    <span class="toggle-switch__slider"></span>'
                  + '  </label>'
                  + '</div>'

                  + '<div class="subject-card__input-group">'
                  + '  <input type="number" class="subject-card__input" '
                  + '    id="inp_' + s.id + '" '
                  + '    min="-33" max="100" step="1" '
                  + '    value="' + st.pct + '" '
                  + (st.on ? '' : 'disabled') + ' '
                  + '    data-sid="' + s.id + '" data-type="input">'
                  + '  <span class="subject-card__input-suffix">%</span>'
                  + '</div>'

                  + '<input type="range" class="subject-card__slider" '
                  + '  id="rng_' + s.id + '" '
                  + '  min="-33" max="100" step="1" '
                  + '  value="' + st.pct + '" '
                  + (st.on ? '' : 'disabled') + ' '
                  + '  data-sid="' + s.id + '" data-type="slider">'

                  + '</div>';
        }
        subsGridEl.innerHTML = html;

        /* بایند رویدادها */
        bindEvents();
    }

    /* ─── Bind Events (Event Delegation) ─── */
    function bindEvents() {
        /* input / slider تغییر مقدار */
        var inputs = subsGridEl.querySelectorAll('.subject-card__input, .subject-card__slider');
        for (var i = 0; i < inputs.length; i++) {
            inputs[i].addEventListener('input', handleInput);
        }

        /* toggle switch */
        var toggles = subsGridEl.querySelectorAll('.toggle-switch input');
        for (var j = 0; j < toggles.length; j++) {
            toggles[j].addEventListener('change', handleToggle);
        }
    }

    function handleInput(e) {
        var sid  = e.target.getAttribute('data-sid');
        var type = e.target.getAttribute('data-type');
        var val  = parseFloat(e.target.value);

        if (isNaN(val)) val = 0;
        val = Math.max(-33, Math.min(100, val));
        state[sid].pct = val;

        /* Sync: input ↔ slider */
        if (type === 'slider') {
            var inp = document.getElementById('inp_' + sid);
            if (inp) inp.value = val;
        } else {
            var rng = document.getElementById('rng_' + sid);
            if (rng) rng.value = val;
        }

        /* debounce محاسبه */
        if (debounceTimer) clearTimeout(debounceTimer);
        debounceTimer = setTimeout(recalc, 40);
    }

    function handleToggle(e) {
        var sid = e.target.getAttribute('data-sid');
        var on  = e.target.checked;
        state[sid].on = on;

        var card = subsGridEl.querySelector('[data-subject="' + sid + '"]');
        var inp  = document.getElementById('inp_' + sid);
        var rng  = document.getElementById('rng_' + sid);

        if (card) {
            if (on) card.classList.remove('subject-card--disabled');
            else    card.classList.add('subject-card--disabled');
        }
        if (inp) inp.disabled = !on;
        if (rng) rng.disabled = !on;

        recalc();
    }

    /* ─── Core Calculation (v6.2) ─── */
    function recalc() {
        if (!curField) return;
        var cfg = FIELDS[curField];
        var sumWP = 0, sumW = 0;
        var items = [];

        for (var i = 0; i < cfg.subs.length; i++) {
            var s  = cfg.subs[i];
            var st = state[s.id];
            if (!st || !st.on) continue;

            var wf = s.w / cfg.tw;
            var contrib = wf * st.pct;
            sumWP += contrib;
            sumW  += s.w;

            items.push({
                name: s.name, icon: s.icon,
                pct: st.pct, wPct: (wf * 100).toFixed(1),
                contrib: contrib.toFixed(2)
            });
        }

        /* نرمال‌سازی وزنی */
        var sw = 0;
        if (sumW > 0) {
            sw = sumWP * (cfg.tw / sumW);
        }

        /* فرمول نهایی */
        var traz = BETA + K * sw;
        traz = Math.max(0, Math.min(MAX_T, Math.round(traz)));

        updateUI(traz, sw, items);
    }

    /* ─── Update Results UI ─── */
    function updateUI(traz, sw, items) {
        trazEl.textContent = toFa(traz.toLocaleString('en-US'));

        var mn = Math.max(0, traz - ERR);
        var mx = Math.min(MAX_T, traz + ERR);
        errorEl.textContent = 'بازه اطمینان: '
            + toFa(Math.round(mn).toLocaleString()) + ' تا '
            + toFa(Math.round(mx).toLocaleString())
            + ' (±' + toFa(String(ERR)) + ')';

        var pct = Math.max(0, Math.min(100, (sw / 100) * 100));
        fillEl.style.width = pct + '%';

        /* Breakdown */
        var bHtml = '<div class="bd-item">'
                  + '<div class="bd-item__label">نمره وزنی</div>'
                  + '<div class="bd-item__value">' + toFa(sw.toFixed(1)) + '</div>'
                  + '</div>';
        for (var i = 0; i < items.length; i++) {
            bHtml += '<div class="bd-item">'
                   + '<div class="bd-item__label">' + items[i].icon + ' ' + items[i].name + '</div>'
                   + '<div class="bd-item__value">' + toFa(String(items[i].pct)) + '%</div>'
                   + '</div>';
        }
        breakdownEl.innerHTML = bHtml;
    }

    /* ─── Utility: To Persian Digits ─── */
    function toFa(str) {
        var fa = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
        return String(str).replace(/[0-9]/g, function(d) { return fa[parseInt(d)]; });
    }

    /* ─── Toast ─── */
    function showToast(msg, dur) {
        dur = dur || 2500;
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        setTimeout(function() {
            toastEl.classList.remove('show');
        }, dur);
    }

    /* ─── Save to localStorage ─── */
    function saveLocal() {
        try {
            var data = { v:'6.2', f:curField, s:state, t:Date.now() };
            localStorage.setItem(SKEY, JSON.stringify(data));
            showToast('✅ ذخیره شد!');
        } catch(e) {
            showToast('❌ خطا در ذخیره!');
        }
    }

    /* ─── Load from localStorage ─── */
    function loadLocal() {
        try {
            var raw = localStorage.getItem(SKEY);
            if (!raw) return;
            var data = JSON.parse(raw);
            if (data.f !== curField) return;
            for (var k in data.s) {
                if (data.s.hasOwnProperty(k) && state[k]) {
                    state[k].pct = data.s[k].pct || 0;
                    state[k].on  = data.s[k].on !== false;
                }
            }
        } catch(e) { /* silent */ }
    }

    /* ─── Auto-load last session ─── */
    function autoLoad() {
        try {
            var raw = localStorage.getItem(SKEY);
            if (!raw) return;
            var data = JSON.parse(raw);
            if (data.f && FIELDS[data.f]) {
                selectField(data.f);
            }
        } catch(e) { /* silent */ }
    }

    /* ─── Reset ─── */
    function resetAll() {
        if (!confirm('همه داده‌ها پاک بشه؟ 🗑️')) return;

        localStorage.removeItem(SKEY);
        curField = null; state = {};

        subsGridEl.style.display = 'none';
        subsGridEl.innerHTML = '';
        resultsEl.style.display = 'none';
        actionsEl.classList.add('hidden');

        var btns = fieldGridEl.querySelectorAll('.field-btn');
        for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');

        trazEl.textContent = '—';
        fillEl.style.width = '0%';
        breakdownEl.innerHTML = '';

        showToast('🗑️ همه چیز پاک شد!');
    }

    /* ─── Export PNG ─── */
    function exportPNG() {
        var container = document.getElementById('appContainer');
        if (!container || typeof html2canvas === 'undefined') {
            showToast('❌ html2canvas بارگذاری نشده!');
            return;
        }
        showToast('📸 آماده‌سازی تصویر...');
        container.classList.add('exporting');

        html2canvas(container, {
            backgroundColor: '#F8F6F2',
            scale: 2,
            useCORS: true,
            logging: false,
            ignoreElements: function(el) {
                return el.classList && el.classList.contains('actions-row');
            }
        }).then(function(canvas) {
            container.classList.remove('exporting');
            var link = document.createElement('a');
            link.download = 'taraz-' + new Date().toISOString().slice(0,10) + '.png';
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
            showToast('✅ تصویر ذخیره شد!');
        }).catch(function(err) {
            container.classList.remove('exporting');
            console.error(err);
            showToast('❌ خطا در ساخت تصویر!');
        });
    }

    /* ─── Action Button Events ─── */
    document.getElementById('btnExport').addEventListener('click', exportPNG);
    document.getElementById('btnSave').addEventListener('click', saveLocal);
    document.getElementById('btnReset').addEventListener('click', resetAll);

    /* ─── Keyboard Shortcuts ─── */
    document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            if (curField) saveLocal();
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 'e') {
            e.preventDefault();
            if (curField) exportPNG();
        }
    });

    /* ─── Boot ─── */
    buildFieldButtons();
    autoLoad();

    if (!curField) {
        setTimeout(function() {
            showToast('👋 سلام! اول رشته‌ت رو انتخاب کن', 3000);
        }, 800);
    }

})();
</script>
</body>
</html>
